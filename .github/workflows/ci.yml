name: CI

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

  push:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache-dependency-path: |
            uv.lock

      - name: Create CI env files
        run: |
          mkdir -p .envs/.local
          printf 'DJANGO_SETTINGS_MODULE=config.settings.test\n' > .envs/.local/.django
          printf 'POSTGRES_HOST=postgres\nPOSTGRES_PORT=5432\nPOSTGRES_DB=navi_backend\nPOSTGRES_USER=navi\nPOSTGRES_PASSWORD=navi\nDATABASE_URL=postgres://navi:navi@postgres:5432/navi_backend\n' > .envs/.local/.postgres
          touch .envs/.local/.stripe

      - name: Build the Stack
        run: docker compose -f docker-compose.local.yml build django


      - name: Build the docs
        run: docker compose -f docker-compose.docs.yml build docs

      - name: Check DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py makemigrations --check

      - name: Run DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py migrate

      - name: Run Django Tests (shard ${{ matrix.group }}/2)
        run: docker compose -f docker-compose.local.yml run django pytest --splits 2 --group ${{ matrix.group }}

      - name: Tear down the Stack
        run: docker compose -f docker-compose.local.yml down
