name: CI

on:
  pull_request:
    branches: ['master', 'main', 'development']
    paths-ignore: ['docs/**']

  push:
    branches: ['master', 'main', 'development']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # Proves the image we actually ship still builds (catches missing system libs,
  # e.g. WeasyPrint -> pango). Runs in parallel with the tests; nothing waits on it.
  # The layer cache is only written on pushes, so PRs don't pay the ~60s upload.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production django image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./compose/production/django/Dockerfile
          push: false
          cache-from: type=gha,scope=django-production
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=django-production,mode=max' || '' }}

  # Tests run directly on the runner (uv + service containers) instead of inside
  # the docker image, so shards start immediately instead of waiting for a build.
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: navi
          POSTGRES_DB: navi_backend
          # Ephemeral CI database: trust auth, so no fake password in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U navi"
          --health-interval 2s --health-timeout 5s --health-retries 15
      redis:
        image: redis:6
        ports: ['6379:6379']

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://navi@localhost:5432/navi_backend
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      # Same runtime libs as the Dockerfile (psycopg[c] builds against libpq;
      # WeasyPrint needs pango at import). Usually preinstalled on the runner.
      - name: Ensure system libraries
        run: |
          pkgs="libpq-dev libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info"
          dpkg -s $pkgs >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends $pkgs; }

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for missing migrations
        if: matrix.group == 1
        run: uv run python manage.py makemigrations --check --dry-run

      # pytest-django builds the test DB by running migrations itself.
      - name: Run Django Tests (shard ${{ matrix.group }}/4)
        run: uv run pytest -p no:sugar --splits 4 --group ${{ matrix.group }}
