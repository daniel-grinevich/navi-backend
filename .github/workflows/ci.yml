name: CI

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

  push:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # Build the django image once (with layer caching) and hand it to the test
  # shards as an artifact, so N shards don't each rebuild it from scratch.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build django image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./compose/local/django/Dockerfile
          tags: navi_backend_local_django:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/django-image.tar

      - name: Upload django image
        uses: actions/upload-artifact@v7
        with:
          name: django-image
          path: /tmp/django-image.tar
          retention-days: 1

  pytest:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Download django image
        uses: actions/download-artifact@v4
        with:
          name: django-image
          path: /tmp

      - name: Load django image
        run: docker load -i /tmp/django-image.tar

      - name: Create CI env files
        run: |
          mkdir -p .envs/.local
          printf 'DJANGO_SETTINGS_MODULE=config.settings.test\n' > .envs/.local/.django
          # Ephemeral CI Postgres uses trust auth, so the URL carries no
          # password (avoids tripping the secret scanner on a fake credential).
          {
            echo "POSTGRES_HOST=postgres"
            echo "POSTGRES_PORT=5432"
            echo "POSTGRES_DB=navi_backend"
            echo "POSTGRES_USER=navi"
            echo "POSTGRES_HOST_AUTH_METHOD=trust"
            echo "DATABASE_URL=postgres://navi@postgres:5432/navi_backend"
          } > .envs/.local/.postgres
          touch .envs/.local/.stripe

      - name: Check DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py makemigrations --check

      - name: Run DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py migrate

      - name: Run Django Tests (shard ${{ matrix.group }}/4)
        run: docker compose -f docker-compose.local.yml run django pytest --splits 4 --group ${{ matrix.group }}

      - name: Tear down the Stack
        run: docker compose -f docker-compose.local.yml down
