name: Security

on:
  pull_request:
    branches: ['master', 'main']
  push:
    branches: ['master', 'main']
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Exclude CI workflow files: they hold no real secrets (those come
          # from GitHub Secrets / the secrets manager), only throwaway
          # ephemeral CI values that would otherwise flag as false positives.
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt

  dependency-scan:
    name: Dependency & config scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
