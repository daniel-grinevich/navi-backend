# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Dependencies are managed with uv (pyproject.toml + uv.lock). uv provisions
# Python 3.14 (per requires-python) and installs the locked deps, including the
# dev group that provides Sphinx.
build:
  os: ubuntu-24.04
  tools:
    python: '3.12'
  commands:
    - pip install uv
    - uv sync --frozen
    - uv run sphinx-build -b html docs $READTHEDOCS_OUTPUT/html
